<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Extra-large Spanish sentence quiz with instant feedback, using the Días inolvidables vocabulary.">
<title>Spanish Sentence Quiz · Días inolvidables</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#173e36;font-family:system-ui,sans-serif}main{height:100svh;padding:clamp(10px,2vh,24px) clamp(12px,2vw,36px);display:grid;grid-template-rows:auto 6px minmax(0,1fr) auto auto;gap:clamp(8px,1.4vh,16px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(20px,3vh,32px);margin:0}header p{font-size:clamp(13px,2vh,20px);margin:4px 0;color:#526960}.stats{font-size:clamp(13px,2.2vh,22px);text-align:right}.progress{background:#dae1d7;border-radius:9px}.progress div{height:100%;background:#287657;border-radius:9px;transition:width .2s}#quiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,2vw,30px);min-height:0}.question{background:#fffef9;border:1px solid #d8dfd3;border-radius:24px;padding:clamp(12px,2vw,32px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}.eyebrow{font-size:clamp(12px,1.8vh,18px);letter-spacing:.1em;text-transform:uppercase;color:#64756b}.sentence{width:100%;height:100%;min-height:0;min-width:0;font-size:clamp(30px,5.8vw,88px);line-height:1.24;font-weight:650;overflow-wrap:anywhere;margin:0;padding:12px 0;background:none;border:0;color:inherit;text-align:left;white-space:normal}.sentence:disabled{opacity:1;color:inherit;cursor:default}.sentence:not(:disabled){cursor:pointer}.blank{display:inline-block;min-width:3em;max-width:100%;border-bottom:4px solid currentColor;text-align:center;color:#267653;line-height:1.15}#hint{font-size:clamp(12px,1.9vh,19px);color:#526960;margin:6px 0 0}.choices{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(8px,1.8vh,18px);min-height:0;min-width:0}button{font-family:inherit}button:focus-visible,a:focus-visible{outline:4px solid #b26a13;outline-offset:3px}.choice{font-size:clamp(24px,4.3vw,64px);line-height:1.12;font-weight:650;background:white;color:#173e36;border:3px solid #c6d3c6;border-radius:18px;padding:clamp(8px,1.7vh,18px);min-height:0;min-width:0;overflow-wrap:anywhere;cursor:pointer}.choice:hover:not(:disabled){background:#e9f0e5;border-color:#287657}.choice:disabled{cursor:default;opacity:1}.choice.wrong{background:#fff0ed;border-color:#b64432;color:#942b1d}.choice.correct{background:#e1f3e5;border-color:#287657}.feedback{font-size:clamp(18px,3vh,32px);font-weight:700;min-height:1.3em;margin:0;color:#26704e;flex:1}.feedback.error{color:#a03324}.controls{display:flex;align-items:center;gap:clamp(8px,2vw,24px)}.action{font-size:clamp(16px,2.6vh,28px);padding:clamp(8px,1.7vh,16px) clamp(10px,2vw,28px);border:0;border-radius:14px;background:#173e36;color:white;cursor:pointer}.action:disabled{opacity:.4;cursor:default}.secondary{background:#e0e7dc;color:#173e36;font-size:clamp(14px,2vh,22px)}footer{font-size:clamp(10px,1.6vh,15px);color:#526960}a{color:inherit}.hidden{display:none!important}@media(max-width:600px){main{gap:7px;padding:10px}.question{padding:12px;border-radius:16px}#quiz{gap:10px}.choice{border-width:2px;padding:8px;border-radius:12px}.controls{flex-wrap:wrap}.feedback{flex-basis:100%}header p{max-width:220px}}
</style></head>
<body><main>
<header><div><h1>Días inolvidables</h1><p>Spanish 2 · Choose the words that complete the sentence.</p></div><div class="stats"><div id="count"></div><div id="score"></div></div></header>
<div class="progress" aria-hidden="true"><div id="bar"></div></div>
<section id="quiz" aria-label="Sentence quiz"><div class="question"><div class="eyebrow">Fill in the blank</div><button class="sentence" id="sentence" lang="es" disabled aria-describedby="hint"></button><p id="hint"></p></div><div class="choices" id="choices" lang="es"></div></section>
<div class="controls"><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="action secondary" id="restart">Start over ↻</button><button class="action" id="next" disabled>Next sentence →</button></div>
<footer>Score counts first-try answers. · Vocabulary: <a href="https://esemmelman.github.io/span020/">Spanish 020 flashcards</a> · 69 words and phrases</footer>
</main><script src="app.js"></script></body></html>
