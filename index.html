<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Extra-large Spanish sentence quiz with instant feedback, using the Días inolvidables vocabulary.">
<title>Spanish Sentence Quiz · Días inolvidables</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#173e36;font-family:system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px clamp(16px,4vw,60px)}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:clamp(25px,3vw,40px);margin:0}header p{font-size:20px;margin:8px 0;color:#526960}.stats{font-size:24px;text-align:right;white-space:nowrap}.progress{height:9px;background:#dae1d7;border-radius:9px;margin:24px 0}.progress div{height:100%;background:#287657;border-radius:9px;transition:width .2s}.question{background:#fffef9;border:1px solid #d8dfd3;border-radius:28px;padding:clamp(24px,4vw,56px);margin-bottom:24px}.eyebrow{font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:#64756b}.sentence{font-size:clamp(42px,5.2vw,78px);line-height:1.45;font-weight:650;margin:22px 0;overflow-wrap:anywhere}.blank{display:inline-block;min-width:3em;border-bottom:5px solid currentColor;text-align:center;color:#267653;line-height:1.2}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}button{font-family:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:5px solid #b26a13;outline-offset:5px}.choice{font-size:clamp(32px,3.5vw,54px);font-weight:650;background:white;color:#173e36;border:3px solid #c6d3c6;border-radius:20px;padding:24px 18px;min-height:110px;overflow-wrap:anywhere}.choice:hover:not(:disabled){background:#e9f0e5;border-color:#287657}.choice:disabled{cursor:default;opacity:1}.choice.wrong{background:#fff0ed;border-color:#b64432;color:#942b1d}.choice.correct{background:#e1f3e5;border-color:#287657}.feedback{font-size:clamp(28px,3vw,44px);font-weight:700;min-height:1.5em;margin:22px 0;color:#26704e}.feedback.error{color:#a03324}.controls{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}.action{font-size:30px;padding:18px 30px;border:0;border-radius:16px;background:#173e36;color:white}.action:disabled{opacity:.4;cursor:default}.secondary{background:#e0e7dc;color:#173e36;font-size:22px}footer{margin:32px 0;font-size:18px;color:#526960}a{color:inherit}.hidden{display:none}@media(max-width:650px){header{align-items:flex-start}.stats{font-size:18px}.choices{grid-template-columns:1fr}.choice{padding:18px;min-height:85px}.sentence{font-size:42px}.question{padding:22px}header p{font-size:17px}}
</style></head>
<body><main>
<header><div><h1>Días inolvidables</h1><p>Choose the Spanish words that complete the sentence.</p></div><div class="stats"><div id="count"></div><div id="score"></div></div></header>
<div class="progress" aria-hidden="true"><div id="bar"></div></div>
<section id="quiz" aria-label="Sentence quiz"><div class="question"><div class="eyebrow">Fill in the blank</div><p class="sentence" id="sentence" lang="es"></p></div><div class="choices" id="choices" lang="es"></div></section>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div class="controls"><button class="action secondary" id="restart">Start over ↻</button><button class="action" id="next" disabled>Next sentence →</button></div>
<footer>Try again after a wrong answer. Your score counts first-try answers.<br>Vocabulary: <a href="https://esemmelman.github.io/span020/">Spanish 020 flashcards</a> · All 69 vocabulary entries, with forms adjusted to fit each sentence.</footer>
</main><script src="app.js"></script></body></html>
